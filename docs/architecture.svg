<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2255c"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d5d9e2; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #1d2330; }
      .sub { font-size: 13px; fill: #5c6477; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #3b4252; }
      .label { font-size: 12.5px; fill: #3b4252; }
      .step { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
      .flow { stroke: #4a5163; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .sse { stroke: #2b8a3e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-green); }
      .event { stroke: #c2255c; stroke-width: 1.8; fill: none; marker-end: url(#arrow-red); }
      .group-title { font-size: 14px; font-weight: 700; letter-spacing: .06em; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f7f9"/>

  <!-- ===================== Restate ===================== -->
  <rect x="600" y="78" width="500" height="752" rx="18" fill="#eef1fb" stroke="#c7cff0" stroke-width="1.5"/>
  <text x="625" y="110" class="group-title" fill="#3b5bdb">RESTATE</text>
  <text x="712" y="110" class="sub">virtual objects: one handler per key at a time, every step journaled</text>

  <!-- Conversation -->
  <rect x="630" y="132" width="440" height="108" rx="12" class="box" stroke="#7048e8" stroke-width="2"/>
  <rect x="630" y="132" width="8" height="108" rx="4" fill="#7048e8"/>
  <text x="655" y="160" class="title">Conversation<tspan class="mono" dx="6">[sessionId]</tspan></text>
  <text x="655" y="184" class="sub">The prompt queue, with no queue code: Restate runs one</text>
  <text x="655" y="202" class="sub">invocation per key at a time, in order. Runs one turn,</text>
  <text x="655" y="220" class="sub">waits on an awakeable, re-drives the turn if the VM dies.</text>

  <!-- Session -->
  <rect x="630" y="290" width="440" height="140" rx="12" class="box" stroke="#3b5bdb" stroke-width="2"/>
  <rect x="630" y="290" width="8" height="140" rx="4" fill="#3b5bdb"/>
  <text x="655" y="318" class="title">Session<tspan class="mono" dx="6">[sessionId]</tspan></text>
  <text x="655" y="342" class="sub">The coordinator. Finds or starts the sandbox, hands</text>
  <text x="655" y="360" class="sub">prompts to the agent, tracks the turn in flight, and</text>
  <text x="655" y="378" class="sub">receives every lifecycle event.</text>
  <text x="655" y="406" class="mono">create · resume · deliverPrompt · onEvent · stop · delete</text>

  <!-- Sandbox -->
  <rect x="630" y="488" width="440" height="108" rx="12" class="box" stroke="#d9480f" stroke-width="2"/>
  <rect x="630" y="488" width="8" height="108" rx="4" fill="#d9480f"/>
  <text x="655" y="516" class="title">Sandbox<tspan class="mono" dx="6">[sandboxId]</tspan></text>
  <text x="655" y="540" class="sub">Digital twin of one VM: start, touch, stop. The idle</text>
  <text x="655" y="558" class="sub">shutdown is a delayed call to itself, cancelled and</text>
  <text x="655" y="576" class="sub">re-sent on every touch.</text>

  <!-- Disk -->
  <rect x="630" y="648" width="440" height="108" rx="12" class="box" stroke="#0c8599" stroke-width="2"/>
  <rect x="630" y="648" width="8" height="108" rx="4" fill="#0c8599"/>
  <text x="655" y="676" class="title">Disk<tspan class="mono" dx="6">[diskId]</tspan></text>
  <text x="655" y="700" class="sub">Digital twin of one persistent disk: create, assign</text>
  <text x="655" y="718" class="sub">to a sandbox, release, delete. Outlives every VM.</text>

  <text x="625" y="806" class="sub">Dependencies only point down: Conversation → Session → Sandbox, Disk</text>

  <!-- internal arrows -->
  <path d="M850,240 L850,288" class="flow"/>
  <circle cx="870" cy="263" r="11" fill="#7048e8"/><text x="866" y="267.5" class="step">2</text>
  <text x="888" y="268" class="label">deliverPrompt + awakeable</text>
  <path d="M740,430 L740,486" class="flow"/>
  <text x="752" y="463" class="label">start · touch · stop</text>
  <path d="M1040,430 L1040,646" class="flow"/>
  <text x="935" y="463" class="label">assign · release</text>
  <circle cx="1060" cy="463" r="11" fill="#3b5bdb"/><text x="1056" y="467.5" class="step">3</text>

  <!-- ===================== Outside world ===================== -->
  <rect x="1160" y="78" width="410" height="752" rx="18" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1185" y="110" class="group-title" fill="#495057">OUTSIDE WORLD</text>
  <text x="1185" y="130" class="sub">dummy services in this repo</text>

  <!-- Agent VM -->
  <rect x="1185" y="150" width="360" height="190" rx="12" class="box" stroke="#2b8a3e" stroke-width="2"/>
  <text x="1205" y="178" class="title">Sandbox VM</text>
  <text x="1310" y="178" class="sub">(a child process)</text>
  <rect x="1205" y="192" width="320" height="130" rx="8" fill="#ebfbee" stroke="#b2f2bb"/>
  <text x="1222" y="216" class="title" style="font-size:15px">agent-server</text>
  <text x="1222" y="238" class="sub">echo "model" + one tool call per turn</text>
  <text x="1222" y="256" class="sub">append-only transcript on the disk</text>
  <text x="1222" y="274" class="sub">repairs and resumes an interrupted turn</text>
  <text x="1222" y="298" class="mono">POST /api/prompt · GET /api/events</text>

  <!-- Disk directory -->
  <rect x="1185" y="370" width="300" height="80" rx="10" fill="#e3fafc" stroke="#99e9f2"/>
  <text x="1205" y="398" class="title" style="font-size:15px">The disk</text>
  <text x="1205" y="420" class="mono">data/disks/&lt;id&gt;/transcript.jsonl</text>
  <text x="1205" y="438" class="sub">mounted by the agent, exclusively</text>
  <path d="M1300,340 L1300,368" class="flow"/>
  <text x="1310" y="359" class="label">read · append</text>

  <!-- Sandbox service -->
  <rect x="1185" y="488" width="360" height="108" rx="12" class="box"/>
  <text x="1205" y="516" class="title">Sandbox service</text>
  <text x="1205" y="540" class="sub">shaped like CubeSandbox · SQLite</text>
  <text x="1205" y="558" class="sub">spawns VMs, waits until healthy,</text>
  <text x="1205" y="576" class="sub">reports every VM exit</text>
  <path d="M1530,488 L1530,342" class="flow"/>
  <text x="1500" y="470" class="label" text-anchor="end">spawns</text>

  <!-- Disk service -->
  <rect x="1185" y="648" width="360" height="108" rx="12" class="box"/>
  <text x="1205" y="676" class="title">Disk service</text>
  <text x="1205" y="700" class="sub">shaped like Archil · SQLite</text>
  <text x="1205" y="718" class="sub">creates and deletes disks,</text>
  <text x="1205" y="736" class="sub">tracks the exclusive mount</text>

  <!-- Restate → outside world -->
  <path d="M1070,320 L1183,320" class="flow"/>
  <circle cx="1095" cy="305" r="11" fill="#3b5bdb"/><text x="1091" y="309.5" class="step">4</text>
  <text x="1110" y="309" class="label">prompt</text>
  <path d="M1070,542 L1183,542" class="flow"/>
  <text x="1080" y="532" class="label">create · destroy</text>
  <path d="M1070,702 L1183,702" class="flow"/>
  <text x="1080" y="692" class="label">create · delete</text>

  <!-- ===================== Browser and proxy ===================== -->
  <rect x="40" y="322" width="190" height="130" rx="12" class="box"/>
  <text x="60" y="352" class="title">Browser</text>
  <text x="60" y="376" class="sub">demo page:</text>
  <text x="60" y="394" class="sub">chat, world view,</text>
  <text x="60" y="412" class="sub">control-plane log</text>

  <rect x="300" y="290" width="240" height="190" rx="12" class="box"/>
  <text x="320" y="320" class="title">Session proxy</text>
  <text x="320" y="344" class="sub">the product API</text>
  <text x="320" y="370" class="sub">the only client of Restate</text>
  <text x="320" y="388" class="sub">streams the current agent's</text>
  <text x="320" y="406" class="sub">events to the browser (SSE)</text>
  <text x="320" y="432" class="sub">forwards lifecycle events</text>
  <text x="320" y="450" class="sub">to Session.onEvent</text>

  <path d="M230,368 L298,368" class="flow"/>
  <text x="240" y="358" class="label">prompts</text>
  <path d="M298,420 L232,420" class="sse"/>
  <text x="244" y="440" class="label" fill="#2b8a3e">SSE</text>

  <!-- proxy → Conversation -->
  <path d="M540,330 C580,330 590,190 628,190" class="flow"/>
  <circle cx="568" cy="262" r="11" fill="#7048e8"/><text x="564" y="266.5" class="step">1</text>
  <text x="312" y="226" class="label">one-way send,</text>
  <text x="312" y="242" class="label">idempotency key</text>

  <!-- proxy → Session.onEvent -->
  <path d="M540,440 C585,440 590,400 628,400" class="flow"/>
  <circle cx="575" cy="458" r="11" fill="#c2255c"/><text x="571" y="462.5" class="step">6</text>
  <text x="550" y="490" class="label">onEvent</text>

  <!-- lifecycle events: agent and sandbox service → proxy -->
  <path d="M1460,150 L1460,46 L420,46 L420,288" class="event"/>
  <path d="M1545,542 L1585,542 L1585,46 L1462,46" stroke="#c2255c" stroke-width="1.8" fill="none"/>
  <circle cx="900" cy="46" r="11" fill="#c2255c"/><text x="896" y="50.5" class="step">5</text>
  <text x="918" y="36" class="label" fill="#c2255c">lifecycle events: turn.ended (agent), sandbox.stopped (sandbox service)</text>

  <!-- SSE: agent → proxy, never through Restate -->
  <path d="M1400,150 L1400,62 L500,62 L500,288" class="sse"/>
  <text x="560" y="78" class="label" fill="#2b8a3e">responses stream agent → proxy → browser, never through Restate</text>

  <!-- ===================== Legend ===================== -->
  <rect x="40" y="540" width="520" height="290" rx="12" class="box"/>
  <text x="62" y="570" class="title">One prompt</text>
  <g class="label" font-size="13">
    <circle cx="72" cy="597" r="11" fill="#7048e8"/><text x="68" y="601.5" class="step">1</text>
    <text x="92" y="602">The proxy sends it to Conversation[session]; Restate queues it.</text>
    <circle cx="72" cy="629" r="11" fill="#7048e8"/><text x="68" y="633.5" class="step">2</text>
    <text x="92" y="634">Conversation makes an awakeable and calls Session.</text>
    <circle cx="72" cy="661" r="11" fill="#3b5bdb"/><text x="68" y="665.5" class="step">3</text>
    <text x="92" y="666">Session reuses the live Sandbox, or assigns the Disk and starts one.</text>
    <circle cx="72" cy="693" r="11" fill="#3b5bdb"/><text x="68" y="697.5" class="step">4</text>
    <text x="92" y="698">Session posts the prompt to the agent (a journaled ctx.run).</text>
    <circle cx="72" cy="725" r="11" fill="#c2255c"/><text x="68" y="729.5" class="step">5</text>
    <text x="92" y="730">When the turn ends, the agent reports turn.ended to the proxy.</text>
    <circle cx="72" cy="757" r="11" fill="#c2255c"/><text x="68" y="761.5" class="step">6</text>
    <text x="92" y="762">Session.onEvent resolves the awakeable; the next prompt runs.</text>
  </g>
  <text x="62" y="798" class="sub">If the VM dies mid-turn, sandbox.stopped aborts the turn and</text>
  <text x="62" y="816" class="sub">Conversation re-drives it on a fresh VM with the same disk.</text>
</svg>
